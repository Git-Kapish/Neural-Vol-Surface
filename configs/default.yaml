# All tickers, paths and grids live here (CLAUDE.md rule 9). Units noted per key.
data:
  ticker: SPY
  raw_dir: data/raw
  processed_dir: data/processed
  synthetic_dir: data/synthetic
  max_expiries: 30          # expiries kept at fetch time (evenly spread if more are available)
  min_dte_days: 7           # drop expiries shorter than this (days)
  max_dte_days: 400         # drop expiries longer than this (days)
  risk_free_rate: 0.04      # fallback continuous rate, decimal per year; overridden by parity fit

clean:
  max_rel_spread: 0.5       # (ask-bid)/mid upper limit, decimal
  min_open_interest: 10     # contracts
  min_volume: 0             # contracts
  min_price: 0.05           # USD, drop tiny-premium quotes
  max_stale_days: 5         # last trade older than this (days) is stale

# Fixed (k, T) training grid used by every network (CLAUDE.md rule 8).
# k = ln(K/F), dimensionless; T in years.
grid:
  k: [-0.20, -0.14, -0.08, -0.04, 0.0, 0.04, 0.08, 0.14, 0.20]
  T: [0.05, 0.10, 0.25, 0.50, 0.75, 1.00]

seed: 0

# Heston parameter box used for training the neural pricer: theta = (v0, kappa, vbar, sigma, rho).
# v0, vbar: instantaneous / long-run variance (annualised, decimal^2); sigma: vol of vol.
heston:
  bounds:
    v0: [0.01, 0.16]
    kappa: [0.5, 6.0]
    vbar: [0.01, 0.16]
    sigma: [0.1, 1.2]
    rho: [-0.95, -0.05]

pricer:
  n_train: 50000
  n_val: 5000
  n_test: 5000
  hidden: 256
  layers: 4
  epochs: 300
  batch: 512
  lr: 0.002
  max_mean_err_volpts: 0.5   # held-out mean abs error threshold used in tests/reporting (vol points)

smoother:
  hidden: 64
  layers: 3
  steps: 4000
  lr: 0.005
  lambda_butterfly: 50.0
  lambda_calendar: 50.0
  n_colloc: 4000
  eval_k: [-0.15, 0.10]      # evaluation window for arbitrage counts (log-moneyness)
  eval_T_min: 0.05           # years
  stress_noise_volpts: 1.0   # gaussian noise (vol points) added to mid IVs in the stress test

calibration:
  n_restarts: 8

synthetic:
  n_days: 1500
  dt: 0.003968254            # 1/252 year
  obs_noise_volpts: 0.3      # gaussian quote noise added to each grid vol, in vol points
  kappa: 2.5                 # fixed Heston parameters
  sigma: 0.6
  # latent OU processes: log v0, log vbar, z (rho = rho_mean + rho_amp tanh z); sd = stationary sd
  latent:
    v0_mean: 0.04
    v0_sd: 0.35
    v0_floor: 0.03           # keeps the far-wing prices above the IV-inversion resolution
    v0_speed: 6.0            # 1/year
    vbar_mean: 0.045
    vbar_sd: 0.15
    vbar_speed: 1.0
    rho_mean: -0.55
    rho_amp: 0.12
    rho_speed: 2.0

forecast:
  min_train: 500
  refit_every: 60
  n_pca: 3
  lags: 3
  mlp_hidden: 64
  mlp_epochs: 60
  mlp_lr: 0.003
